<style>
:root{--bg:#000;--card:#121212;--card2:#1a1a1a;--line:#2c2c2c;--cy:#fff;--tx:#fff;--mut:#9a9a9a;--yel:#d0d0d0;--gry:#555;--grn:#bbb;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
 padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + 14px);overscroll-behavior-y:none}
header{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 14px}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0}
h2{font-size:13px;color:var(--mut);margin:22px 4px 8px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;min-height:46px;padding:0 14px;background:var(--card2);color:var(--tx);cursor:pointer}
button:active{opacity:.7}
button.pri,button.on{background:#fff;color:#000}button.dng{background:#3a3a3a}
.icb{min-height:40px;width:40px;padding:0;border-radius:20px;display:grid;place-items:center;background:var(--card2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
input,select,textarea{font:inherit;font-size:17px;width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:#0b0b0b;color:var(--tx);padding:0 12px;-webkit-appearance:none;appearance:none}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto}
textarea{min-height:70px;padding:10px}
label{font-size:12px;color:var(--mut);display:block;margin:10px 2px 4px}
.big{font-size:52px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1.05}
.sub{color:var(--mut);font-size:13px}
.hero{padding:22px 18px;background:linear-gradient(160deg,#1c1c1c,#0c0c0c);border:1px solid #222}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:var(--r);padding:14px}.stat b{display:block;font-size:22px;margin:4px 0 2px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mut)}
.flag{color:var(--yel);font-size:12px;font-weight:700;margin-top:4px}
.tm{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.lg{width:28px;height:28px;display:inline-grid;place-items:center;flex:none}
.lg img{width:28px;height:28px;object-fit:contain}
.lg.big2,.lg.big2 img{width:44px;height:44px}
.badge{display:inline-grid;place-items:center;width:100%;height:100%;border-radius:50%;border:1.5px solid #fff;font-size:9px;font-weight:800;letter-spacing:-.3px}
.lg.big2 .badge{font-size:13px}
.match{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.match .side{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;font-weight:700}
.match .at{color:var(--mut);font-size:15px}
/* swipe rows */
.swr{position:relative;border-radius:16px;overflow:hidden;margin:0 0 10px;background:#2a2a2a}
.swa{position:absolute;inset:0 0 0 auto;display:flex}
.swa button{border-radius:0;min-height:100%;width:80px}
.swa .ed{background:#5a5a5a;color:#fff}.swa .dl{background:#fff;color:#000}
.swf{position:relative;background:var(--card);padding:14px;transition:transform .25s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;border-left:4px solid var(--gry)}
.swf.w{border-left-color:#fff}.swf.u{border-left-color:#777}
.swf.drag{transition:none}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:36px;border-radius:9px;background:transparent;font-size:14px}.seg button.on{background:#fff;color:#000}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:6px calc(env(safe-area-inset-right) + 6px) calc(env(safe-area-inset-bottom) + 6px) calc(env(safe-area-inset-left) + 6px);
 background:rgba(10,10,10,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid #333;z-index:10}
nav button{flex:1;background:none;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:#777;padding:0}
nav button svg{width:24px;height:24px}
nav button.on{color:#fff;background:none}
nav button.add svg{width:34px;height:34px;color:#fff}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hide{display:none}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-size:11px;color:var(--mut);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;min-height:0;padding:0;background:transparent;font-weight:500}
.cal .d.o{color:#444}.cal .d.t{border:1px solid #fff}.cal .d.sel{background:#fff;color:#000}
.dots{display:flex;gap:3px;height:6px;margin-top:3px}.dots i{width:5px;height:5px;border-radius:50%;background:#fff}.dots i.p{background:#777}
.cal .d.sel .dots i{background:#000}
.pd{font-size:9px;color:var(--mut);height:6px;line-height:6px}
.chart svg{width:100%;height:auto;display:block}

 if(view=="shifts"){
  const list=shifts.filter(s=>filt=="all"||(filt=="worked")==(s.status=="worked")).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)*(filt=="upcoming"?1:-1));
  $("#v-shifts").innerHTML=`<div class="seg"><button data-f="upcoming">Upcoming</button><button data-f="worked">Worked</button><button data-f="all">All</button></div>
  <div class="sub" style="margin:0 4px 10px">Swipe left (or tap) a shift for Edit / Delete</div>`+(list.map(shiftRow).join("")||'<div class="sub card">Nothing here</div>');
  $$("[data-f]").forEach(b=>{b.classList.toggle("on",b.dataset.f==filt);b.onclick=()=>{filt=b.dataset.f;render()}});
  bindRows($("#v-shifts"));
 }
 if(view=="cal"){
  if(!calM)calM=today().slice(0,7);const[y,m]=calM.split("-").map(Number),first=new Date(y,m-1,1).getDay(),nd=lastDay(y,m-1),tod=today();
  const by={};shifts.forEach(s=>(by[s.date]=by[s.date]||[]).push(s));
  let cells=["S","M","T","W","T","F","S"].map(d=>`<div class="dw">${d}</div>`).join("");
  for(let i=0;i<first;i++)cells+="<div></div>";
  for(let d=1;d<=nd;d++){const k=`${y}-${pad(m)}-${pad(d)}`,ss=by[k]||[],isPay=d==15||d==secondPay(y,m-1);
   cells+=`<button class="d${k==tod?" t":""}${k==calSel?" sel":""}" data-day="${k}" aria-label="${k}${ss.length?", "+ss.length+" shift(s)":""}">${d}<span class="dots">${ss.slice(0,3).map(s=>`<i class="${s.status=="worked"?"":"p"}"></i>`).join("")}</span>${isPay?'<span class="pd">$</span>':'<span class="pd"></span>'}</button>`}
  const sel=calSel&&by[calSel]||[];
  $("#v-cal").innerHTML=`<div class="card"><div class="row" style="margin-bottom:10px"><button class="icb" style="flex:0 0 40px" id="cp" aria-label="Previous month">‹</button><b style="text-align:center;font-size:17px">${new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><button class="icb" style="flex:0 0 40px" id="cn" aria-label="Next month">›</button></div>
  <div class="cal">${cells}</div><div class="sub" style="margin-top:10px">● worked &nbsp; <span style="color:#777">●</span> upcoming &nbsp; $ payday</div></div>
  ${calSel?`<h2>${fmtD(calSel)}</h2>`+(sel.map(shiftRow).join("")||'<div class="card sub">No shifts this day</div>'):""}`;
  const mv=n=>{const d=new Date(y,m-1+n,1);calM=ymd(d).slice(0,7);render()};$("#cp").onclick=()=>mv(-1);$("#cn").onclick=()=>mv(1);
  $$("[data-day]").forEach(b=>b.onclick=()=>{calSel=b.dataset.day;render()});
  bindRows($("#v-cal"));
 }
 if(view=="form"){
  const s=shifts.find(x=>x.id==editId)||{date:calSel||today(),away:"",home:"",position:set.positions[0],mode:"Remote",start:"",end:"",hours:"",status:"upcoming",confirm:false,notes:""};
  const opt=(arr,v)=>arr.map(a=>`<option ${a==v?"selected":""}>${esc(a)}</option>`).join("");
  $("#v-form").innerHTML=`<h2>${editId?"Edit":"Log"} shift</h2><div class="card">
  <label>Date</label><input type="date" id="f-date" value="${esc(s.date)}">
  <div class="row"><div><label>Away</label><select id="f-away"><option value="">—</option>${opt(TEAMS,s.away)}</select></div><b style="flex:0;padding-top:24px">@</b><div><label>Home</label><select id="f-home"><option value="">—</option>${opt(TEAMS,s.home)}</select></div></div>
  <label>Position</label><select id="f-pos">${opt(set.positions,s.position)}</select>
  <label>Location</label><div class="row"><button id="m-r" class="${s.mode=="Remote"?"on":""}">Remote</button><button id="m-i" class="${s.mode!="Remote"?"on":""}">In-person</button></div>
  <div class="row"><div><label>Start</label><input type="time" id="f-start" value="${esc(s.start)}"></div><div><label>End</label><input type="time" id="f-end" value="${esc(s.end)}"></div></div>
  <label>Hours worked (overrides start/end)</label><input type="number" step="0.25" inputmode="decimal" id="f-hours" value="${esc(s.hours)}">
  <label>Status</label><div class="row"><button id="s-u" class="${s.status!="worked"?"on":""}">Upcoming</button><button id="s-w" class="${s.status=="worked"?"on":""}">Worked</button></div>
  <label><input type="checkbox" id="f-conf" style="width:auto;min-height:0" ${s.confirm?"checked":""}> Hours need confirming</label>
  <label>Notes</label><textarea id="f-notes">${esc(s.notes||"")}</textarea>
  <div class="sub" id="f-calc" style="margin-top:8px"></div>
  <div class="row" style="margin-top:12px"><button class="pri" id="f-save">Save</button>${editId?'<button class="dng" id="f-del">Delete</button>':""}</div></div>`;
  let mode=s.mode,st=s.status;
  const calc=()=>{const h=hoursOf({hours:$("#f-hours").value,start:$("#f-start").value,end:$("#f-end").value});$("#f-calc").textContent=`${hrs(h)} × ${money(+set.rate)} = ${money(h*set.rate)} gross${netLine(h*set.rate)}`};
  ["#f-hours","#f-start","#f-end"].forEach(i=>$(i).oninput=calc);calc();
  $("#m-r").onclick=()=>{mode="Remote";$("#m-r").classList.add("on");$("#m-i").classList.remove("on")};
  $("#m-i").onclick=()=>{mode="In-person";$("#m-i").classList.add("on");$("#m-r").classList.remove("on")};
  $("#s-u").onclick=()=>{st="upcoming";$("#s-u").classList.add("on");$("#s-w").classList.remove("on")};
  $("#s-w").onclick=()=>{st="worked";$("#s-w").classList.add("on");$("#s-u").classList.remove("on")};
  $("#f-save").onclick=()=>{const o=Object.assign({},s,{id:s.id||("s"+Date.now()),date:$("#f-date").value,away:$("#f-away").value,home:$("#f-home").value,position:$("#f-pos").value,mode,start:$("#f-start").value,end:$("#f-end").value,hours:$("#f-hours").value,status:st,confirm:$("#f-conf").checked,notes:$("#f-notes").value});
   if(!o.date)return alert("Date required");const i=shifts.findIndex(x=>x.id==o.id);i>=0?shifts[i]=o:shifts.push(o);save();filt=st;show("shifts")};
  if(editId)$("#f-del").onclick=()=>{if(confirm("Delete this shift?")){shifts=shifts.filter(x=>x.id!=editId);save();show("shifts")}};
 }
 if(view=="pay"){
  const map={};for(const s of shifts){const p=periodFor(s.date,set).payday;(map[p]=map[p]||[]).push(s)}
  Object.keys(pays).forEach(p=>map[p]=map[p]||[]);
  $("#v-pay").innerHTML=`<div class="card chart"><div class="seg"><button data-cm="period">Per pay period</button><button data-cm="month">Per month</button></div>${chartSVG(chartMode)}</div><h2>Paydays</h2>`+Object.keys(map).sort().reverse().map(p=>{const w=sum(map[p],set,s=>s.status=="worked"),a=sum(map[p],set,()=>true),r=pays[p];
   return `<div class="card" style="border-left:4px solid ${r?"#fff":"#555"}"><div class="row"><b style="flex:2">${fmtD(p)}</b><b style="text-align:right">${money(a.g)}</b></div>
   <div class="sub" style="margin-top:4px">${a.n} shift(s) · ${hrs(a.h)} · worked ${money(w.g)}${netLine(a.g)}</div>
   ${r?`<div style="color:var(--grn);margin-top:4px">Received ${money(+r.amount)} · diff vs gross ${money(+r.amount-a.g)}${+set.tax?` · vs est. net ${money(+r.amount-net(a.g))}`:""}</div>`:""}
   <div class="row" style="margin-top:10px"><input type="number" step="0.01" inputmode="decimal" placeholder="Actual amount" data-amt="${p}" value="${r?r.amount:""}"><button class="pri" data-rcv="${p}">${r?"Update":"Mark received"}</button>${r?`<button data-clr="${p}">Clear</button>`:""}</div></div>`}).join("");
  $$("[data-cm]").forEach(b=>{b.classList.toggle("on",b.dataset.cm==chartMode);b.onclick=()=>{chartMode=b.dataset.cm;render()}});
  $$("[data-rcv]").forEach(b=>b.onclick=()=>{const v=document.querySelector(`[data-amt="${b.dataset.rcv}"]`).value;if(v==="")return alert("Enter amount");pays[b.dataset.rcv]={amount:+v,at:today()};save();render()});
  $$("[data-clr]").forEach(b=>b.onclick=()=>{delete pays[b.dataset.clr];save();render()});
 }
 if(view=="set"){
  $("#v-set").innerHTML=`<div class="card">
  <label>Hourly rate ($)</label><input type="number" step="0.01" id="c-rate" value="${set.rate}">
  <label>Estimated tax % (0 = off)</label><input type="number" step="0.5" id="c-tax" value="${set.tax}">
  <label>Pay period split: shifts on day 1–N paid on the 15th; N+1–end paid on the 30th (last day in Feb)</label><input type="number" min="1" max="28" id="c-split" value="${set.split}">
  <div class="row"><div><label>Season start month</label><input type="number" min="1" max="12" id="c-ss" value="${set.seasonStart}"></div><div><label>Season end month</label><input type="number" min="1" max="12" id="c-se" value="${set.seasonEnd}"></div></div>
  <label>Positions (comma separated)</label><input id="c-pos" value="${esc(set.positions.join(", "))}">
  <button class="pri" id="c-save" style="width:100%;margin-top:14px">Save settings</button></div>
  <h2>Schedule</h2><div class="card"><button id="b-sync" style="width:100%">Sync schedule</button><div class="sub" id="sync-at" style="margin-top:8px">Last sync: ${set.lastSync?new Date(set.lastSync).toLocaleString():"never"}</div></div>
  <h2>Backup</h2><div class="card"><div class="row"><button id="b-exp">Export CSV</button><button id="b-imp">Import CSV</button></div>
  <input type="file" id="b-file" accept=".csv,text/csv" class="hide"><div class="sub" style="margin-top:8px">Import merges by id (replaces matching shifts).</div></div>`;
  $("#c-save").onclick=()=>{set.rate=+$("#c-rate").value||29;set.tax=+$("#c-tax").value||0;set.split=Math.min(28,Math.max(1,+$("#c-split").value||15));set.seasonStart=+$("#c-ss").value||10;set.seasonEnd=+$("#c-se").value||6;
   set.positions=$("#c-pos").value.split(",").map(x=>x.trim()).filter(Boolean);save();alert("Saved")};
  $("#b-exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([toCSV(shifts)],{type:"text/csv"}));a.download="gigs-"+today()+".csv";a.click()};
  $("#b-sync").onclick=()=>syncSchedule(true);
  $("#b-imp").onclick=()=>$("#b-file").click();
  $("#b-file").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const rows=parseCSV(t);rows.forEach(r=>{if(!r.id)r.id="s"+Date.now()+Math.random();const i=shifts.findIndex(x=>x.id==r.id);i>=0?shifts[i]=r:shifts.push(r)});save();alert(`Imported ${rows.length} shift(s)`);show("dash")})};
 }
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;t.style.cssText="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.3)";document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function syncSchedule(manual){if(typeof fetch!=="function")return Promise.resolve();
 return fetch("schedule.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  const r=mergeSchedule(shifts,imported,d&&d.games);shifts=r.shifts;imported=r.imported;
  for(const s of shifts)if(s.position&&!set.positions.includes(s.position))set.positions.push(s.position);
  set.lastSync=new Date().toISOString();save();render();
  if(r.added)toast(`Added ${r.added} game${r.added>1?"s":""}`);else if(manual)toast("Schedule up to date")}).catch(()=>{if(manual)toast("Sync failed – offline?")})}
window.__sync=syncSchedule;
render();syncSchedule(false);}
</script></body></html>
